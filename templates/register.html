{% extends "base.html" %}

{% block title %}Регистрация — {{ site_name }}{% endblock %}

{% block nav %}
<nav class="header-nav">
  <a href="{{ url_for('index') }}">На главную</a>
  <a href="{{ url_for('contragent_login') }}">Вход</a>
</nav>
{% endblock %}

{% block content %}
<div class="card login-card">
  <h1>Регистрация контрагента</h1>
  <p class="muted">Создайте аккаунт, чтобы загружать счета и отслеживать их статус.</p>

  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="hp-field" aria-hidden="true">
      <label for="website">Website</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <div class="field">
      <label for="название">Название организации *</label>
      <input type="text" id="название" name="название" value="{{ form.get('название', '') }}" required>
    </div>

    <div class="field">
      <label for="контрагент">Контрагент (из справочника)</label>
      <input type="text" id="контрагент" name="контрагент" list="contragents-list"
             value="{{ form.get('контрагент', '') }}">
      <datalist id="contragents-list">
        {% for c in contragents %}<option value="{{ c }}">{% endfor %}
      </datalist>
    </div>

    <div class="field">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" required>
    </div>

    <div class="field">
      <label for="телефон">Телефон</label>
      <input type="text" id="телефон" name="телефон" value="{{ form.get('телефон', '') }}">
    </div>

    <div class="field">
      <label for="password">Пароль * (мин. 8 символов)</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required>
    </div>

    <div class="field">
      <label for="password2">Повторите пароль *</label>
      <input type="password" id="password2" name="password2" autocomplete="new-password" required>
    </div>

    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
  </form>
</div>
{% endblock %}
